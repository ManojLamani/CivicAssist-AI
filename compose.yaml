name: civicassist

x-backend: &backend
  build: ./backend
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-civicassist}:${POSTGRES_PASSWORD:-civicassist_local}@postgres:5432/${POSTGRES_DB:-civicassist}
    REDIS_URL: redis://redis:6379/0
    QDRANT_URL: http://qdrant:6333
    FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    JWT_SECRET: ${JWT_SECRET:-}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civicassist}
      POSTGRES_USER: ${POSTGRES_USER:-civicassist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civicassist_local}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.17.0
    ports: ["127.0.0.1:6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }

  backend:
    <<: *backend
    ports: ["127.0.0.1:${BACKEND_PORT:-8000}:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 12s
      retries: 12
      start_period: 20s

  worker:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      backend: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["127.0.0.1:${FRONTEND_PORT:-3000}:3000"]
    depends_on:
      backend: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
