[project]
name = "civicassist-backend"
version = "0.1.0"
description = "CivicAssist API and background services"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi[standard]>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "geoalchemy2>=0.17,<1",
  "celery[redis]>=5.4,<6",
  "redis>=5,<7",
  "qdrant-client>=1.13,<2",
  "google-genai>=1,<2",
  "rank-bm25>=0.2.2,<1",
  "pymupdf>=1.25,<2",
  "pytesseract>=0.3.13,<1",
  "pillow>=11,<13",
  "boto3>=1.36,<2",
  "pwdlib[argon2]>=0.2,<1",
  "pyjwt[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=3.4,<6", "faster-whisper>=1.1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
